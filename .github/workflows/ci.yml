name: Verify plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node scripts/sdk-smoke.mjs
      - run: npm run pack:plugin
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: build-android-apps-plugin
          path: artifacts/build-android-apps-*
          include-hidden-files: true
  real-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Install pinned native trace processor for integration analysis
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/perfetto"
          curl --fail --location --retry 3 https://github.com/google/perfetto/releases/download/v58.2/linux-amd64.zip -o "$RUNNER_TEMP/perfetto.zip"
          echo "32c739f71b2d39721afd294c0b038f2499a44a71b5b6bcdd85b83faca0b240b9  $RUNNER_TEMP/perfetto.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/perfetto.zip" -d "$RUNNER_TEMP/perfetto"
          chmod +x "$RUNNER_TEMP/perfetto/linux-amd64/trace_processor_shell"
          echo "ANDROID_PLUGIN_TRACE_PROCESSOR=$RUNNER_TEMP/perfetto/linux-amd64/trace_processor_shell" >> "$GITHUB_ENV"
      - run: node --test tests/analysis.test.mjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node scripts/integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-emulator-evidence
          path: artifacts/integration/
