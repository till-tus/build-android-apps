name: Verify plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - name: Scan full history and current source for secrets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/source-scan"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact --config .gitleaks.toml
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-scan"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/source-scan" --redact --config .gitleaks.toml
  cross-platform:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Check that the committed runtime and notices are current
        run: git diff --exit-code -- server/dist/cli.mjs assets/THIRD_PARTY_LICENSES.txt
      - run: node scripts/sdk-smoke.mjs
      - run: npm run pack:plugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: build-android-apps-plugin
          path: artifacts/build-android-apps-*
          include-hidden-files: true
  real-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Install pinned native trace processor for integration analysis
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/perfetto"
          curl --fail --location --retry 3 https://github.com/google/perfetto/releases/download/v58.2/linux-amd64.zip -o "$RUNNER_TEMP/perfetto.zip"
          echo "32c739f71b2d39721afd294c0b038f2499a44a71b5b6bcdd85b83faca0b240b9  $RUNNER_TEMP/perfetto.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/perfetto.zip" -d "$RUNNER_TEMP/perfetto"
          chmod +x "$RUNNER_TEMP/perfetto/linux-amd64/trace_processor_shell"
          echo "ANDROID_PLUGIN_TRACE_PROCESSOR=$RUNNER_TEMP/perfetto/linux-amd64/trace_processor_shell" >> "$GITHUB_ENV"
      - run: node --test tests/analysis.test.mjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node scripts/integration.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-emulator-evidence
          path: artifacts/integration/
